<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="400" viewBox="0 0 1200 400"
     role="img" aria-labelledby="title desc">
  <title id="title">v8blob-to-js V8 cached bytecode recovery pipeline</title>
  <desc id="desc">A PowerShell-first pipeline from V8 cached bytecode through profile and snapshot detection to recovered JavaScript and analysis artifacts.</desc>

  <rect width="1200" height="400" fill="#F4F1EA"/>
  <path d="M56 54H1144" stroke="#C8CBC1" stroke-width="2"/>
  <path d="M622 54V346" stroke="#C8CBC1" stroke-width="2"/>

  <g id="title-block" transform="translate(56 84)" fill="#161A19">
    <text x="0" y="0" fill="#6F8D75" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">V8 RECOVERY TOOLKIT / POWERSHELL FIRST</text>
    <text x="0" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="58" font-weight="750">v8blob-to-js</text>
    <text x="0" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="24" font-weight="600">Recover readable JavaScript from</text>
    <text x="0" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="24" font-weight="600">V8 cached bytecode.</text>

    <g transform="translate(0 214)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">
      <text x="0" y="0">AUTO INPUT</text>
      <text x="154" y="0" fill="#66706C">|</text>
      <text x="178" y="0">QUALITY GATES</text>
      <text x="354" y="0" fill="#66706C">|</text>
      <text x="378" y="0">FUNCTION GRAPH</text>
    </g>
  </g>

  <g id="pipeline" transform="translate(670 78)">
    <text x="0" y="0" fill="#161A19" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700">RECOVERY PIPELINE</text>

    <g id="input-stage" transform="translate(0 34)">
      <rect width="190" height="72" rx="12" fill="#FCFBF6" stroke="#161A19" stroke-width="2"/>
      <text x="18" y="28" fill="#66706C" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">INPUT</text>
      <text x="18" y="54" fill="#161A19" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="700">.v8blob / .jsc</text>
    </g>

    <path d="M202 70H226" stroke="#E56B35" stroke-width="3"/>
    <path d="M220 63L228 70L220 77" fill="none" stroke="#E56B35" stroke-width="3"/>

    <g id="profile-stage" transform="translate(240 34)">
      <rect width="190" height="72" rx="12" fill="#E8EEE6" stroke="#6F8D75" stroke-width="2"/>
      <text x="18" y="28" fill="#4F6855" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">DETECT</text>
      <text x="18" y="54" fill="#161A19" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">profile / snapshot</text>
    </g>

    <path d="M335 118V148" stroke="#E56B35" stroke-width="3"/>
    <path d="M328 142L335 150L342 142" fill="none" stroke="#E56B35" stroke-width="3"/>

    <g id="source-stage" transform="translate(240 162)">
      <rect width="190" height="72" rx="12" fill="#FFF0E7" stroke="#E56B35" stroke-width="2"/>
      <text x="18" y="28" fill="#A24C26" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">RECOVER</text>
      <text x="18" y="54" fill="#161A19" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="700">recovered.js</text>
    </g>

    <path d="M228 198H202" stroke="#E56B35" stroke-width="3"/>
    <path d="M208 191L200 198L208 205" fill="none" stroke="#E56B35" stroke-width="3"/>

    <g id="analysis-stage" transform="translate(0 162)">
      <rect width="190" height="72" rx="12" fill="#FCFBF6" stroke="#161A19" stroke-width="2"/>
      <text x="18" y="28" fill="#66706C" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">ANALYZE</text>
      <text x="18" y="54" fill="#161A19" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">function graph</text>
    </g>

    <path d="M95 242V270" stroke="#6F8D75" stroke-width="3"/>
    <path d="M88 264L95 272L102 264" fill="none" stroke="#6F8D75" stroke-width="3"/>
    <g id="quality-stage" transform="translate(0 282)">
      <rect width="430" height="48" rx="10" fill="#161A19"/>
      <text x="18" y="31" fill="#F4F1EA" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">syntax  OK</text>
      <text x="158" y="31" fill="#A8C2AA" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">residue  OK</text>
      <text x="316" y="31" fill="#F2B493" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">report  JSON</text>
    </g>
  </g>
</svg>
