<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="420" viewBox="0 0 1200 420"
     role="img" aria-labelledby="title desc">
  <title id="title">v8bytecode-recover: recover readable JavaScript from V8 cached bytecode</title>
  <desc id="desc">Left side names the project and its promise. Right side shows real material: a V8 bytecode disassembly fragment flowing through quality gates into recovered, syntax-checked JavaScript.</desc>

  <!-- Palette: warm paper #F4F1EA / ink #161A19 / green #4F6855 / orange #E56B35 / muted #66706C -->
  <rect width="1200" height="420" fill="#F4F1EA"/>

  <!-- faint byte-column motif -->
  <g fill="none" stroke="#DAD6CA" stroke-width="1.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
    <text x="40" y="398" fill="#C9C5B7">65 f6 f5 f4 0f</text>
    <text x="180" y="398" fill="#D3CFC2">61 f8 f7 f6 11</text>
    <text x="330" y="398" fill="#C9C5B7">2f f7 04 0b</text>
    <text x="480" y="398" fill="#D3CFC2">c7 c8 c5</text>
    <text x="600" y="398" fill="#C9C5B7">13 06 0b f8</text>
    <text x="760" y="398" fill="#D3CFC2">ae</text>
  </g>

  <g id="title-block" transform="translate(64 78)">
    <text x="0" y="0" fill="#A24C26" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" letter-spacing="2">V8 CACHED BYTECODE → JAVASCRIPT</text>
    <text x="0" y="72" fill="#161A19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="62" font-weight="800">v8bytecode-recover</text>
    <text x="0" y="122" fill="#161A19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="600">Turn .jsc and .v8blob files back into</text>
    <text x="0" y="156" fill="#161A19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="600">readable, verified JavaScript.</text>

    <g transform="translate(0 208)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700">
      <rect x="0" y="-24" width="176" height="34" rx="8" fill="#E8EEE6"/>
      <text x="16" y="-1" fill="#4F6855">130 profiles</text>
      <rect x="192" y="-24" width="150" height="34" rx="8" fill="#FFF0E7"/>
      <text x="208" y="-1" fill="#A24C26">auto d8 fetch</text>
      <rect x="358" y="-24" width="230" height="34" rx="8" fill="#161A19"/>
      <text x="374" y="-1" fill="#F4F1EA">quality-gated output</text>
    </g>

    <g transform="translate(0 268)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#66706C">
      <text x="0" y="0">$ node bin/v8bytecode-recover.mjs app.jsc -o out</text>
      <text x="0" y="32" fill="#4F6855">[1/1] app.jsc OK [snapshot: node.exe] -&gt; out/app.js</text>
      <rect x="0" y="46" width="10" height="20" fill="#4F6855"/>
    </g>
  </g>

  <g id="proof-block" transform="translate(700 56)">
    <!-- bytecode panel (before) -->
    <rect x="0" y="0" width="436" height="128" rx="12" fill="#161A19"/>
    <text x="20" y="30" fill="#66706C" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700">app.jsc · Ignition disassembly</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#B9C2BE">
      <text x="20" y="56">0x231 LdaGlobal [3], [9]</text>
      <text x="20" y="76">0x235 GetNamedProperty r2, [4]</text>
      <text x="20" y="96">0x245 CallProperty1 r3, r4, r5</text>
      <text x="20" y="116">0x251 Return</text>
    </g>

    <!-- arrow with gate label -->
    <path d="M218 136V168" stroke="#E56B35" stroke-width="3"/>
    <path d="M210 160L218 170L226 160" fill="none" stroke="#E56B35" stroke-width="3"/>

    <!-- recovered panel (after) -->
    <rect x="0" y="180" width="436" height="152" rx="12" fill="#FCFBF6" stroke="#161A19" stroke-width="2"/>
    <text x="20" y="210" fill="#4F6855" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700">out/app.js · syntax OK · residue-free</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">
      <text x="20" y="240" fill="#161A19">switch (value) {</text>
      <text x="36" y="264"><tspan fill="#A24C26">case 1:</tspan><tspan fill="#161A19"> return "one";</tspan></text>
      <text x="36" y="288"><tspan fill="#A24C26">case 2:</tspan><tspan fill="#161A19"> return "two";</tspan></text>
      <text x="20" y="312" fill="#161A19">}</text>
    </g>
  </g>
</svg>
